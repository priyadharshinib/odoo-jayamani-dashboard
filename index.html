<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jayamani Dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2430;--mu:#6b7686;--bd:#e3e7ee;--ac:#2563eb;--gn:#15803d;--rd:#b91c1c;--am:#fef3c7}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#93a0b2;--bd:#2c3644;--ac:#60a5fa;--gn:#4ade80;--rd:#f87171;--am:#3a3216}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0 auto;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:1100px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0}input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k small{color:var(--mu)}.k b{display:block;font-size:21px;margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow-x:auto;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}td.n,th.n{text-align:right}
tfoot td{font-weight:700}.pos{color:var(--gn)}.neg{color:var(--rd)}#msg,#lm{color:var(--rd);margin:8px 0}
#rem{background:var(--am);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-weight:600}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:12px}.f>*{width:100%}
.done td{opacity:.5;text-decoration:line-through}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:12px;align-items:start}@media(max-width:520px){.g2{grid-template-columns:1fr}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.bd{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}.cr{background:var(--rd);color:#fff}.hi{background:#f59e0b;color:#1c2430}.wa{background:var(--bd)}
.bar{height:5px;border-radius:3px;background:var(--ac);margin-top:3px}.it{padding:9px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
</style></head><body>
<div id="login" class="box" style="max-width:340px;margin:12vh auto;padding:20px">
 <h1>Jayamani Dashboard</h1><p style="color:var(--mu)">Sign in to continue</p>
 <input id="u" placeholder="Username" autocomplete="username" style="width:100%;margin:5px 0">
 <input id="p" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;margin:5px 0">
 <button id="li" style="width:100%;margin-top:6px">Sign in</button><div id="lm"></div></div>
<div id="app" hidden>
<header><h1>Daily Dashboard</h1>
<div><input type="date" id="d"> <select id="c"><option value="">All companies</option></select> <button id="go">Refresh</button> <button class="g" onclick="out()">Sign out</button></div></header>
<div style="color:var(--mu);margin:-6px 0 10px" id="who"></div>
<div id="rem" hidden></div><div id="msg"></div>
<div class="kpis" id="kpis"></div><div class="tabs" id="tabs"></div><div id="main"></div>
</div>
<script>
const $=id=>document.getElementById(id),fmt=n=>'₹'+(n||0).toLocaleString('en-IN',{maximumFractionDigits:0}),sum=(a,k='amount')=>a.reduce((s,x)=>s+x[k],0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS={today:'Today',sales:'Sales',pre:'Prebookings',purch:'Purchases',profit:'Profit',credit:'Credit dues',tasks:'Tasks',users:'Users'};
let ME,D,TK=[],US=[],tab,pre={},CR=[];const seen=new Set();
$('d').value=new Date(Date.now()+19800000).toISOString().slice(0,10);
/*API*/async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+(sessionStorage.t||'')},body:b&&JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='login')out();if(!r.ok)throw Error(j.error||r.status);return j}/*END*/
function out(){sessionStorage.clear();location.reload()}
$('li').onclick=async()=>{try{window.Notification&&Notification.requestPermission();const j=await api('login','POST',{username:$('u').value.trim().toLowerCase(),password:$('p').value});sessionStorage.t=j.token;sessionStorage.me=JSON.stringify(j.user);start()}catch(e){$('lm').textContent=e.message}};
async function start(){ME=JSON.parse(sessionStorage.me);$('login').hidden=true;$('app').hidden=false;$('who').textContent=ME.name+' · '+ME.role;tab='today';await load()}
async function load(){
  $('msg').style.color='';$('msg').textContent='Loading…';
  try{[TK,US]=await Promise.all([api('tasks'),api('users')])}catch(e){$('msg').textContent=e.message;return}
  D=await api('data?date='+$('d').value).catch(e=>{$('msg').textContent='Odoo: '+e.message;return{sales:[],pre:[],purch:[],profit:[],credit:[],companies:[]}});
  if($('c').options.length<2)D.companies.forEach(n=>$('c').add(new Option(n,n)));
  if(!$('msg').textContent.startsWith('Odoo'))$('msg').textContent='';render()
}
const has=k=>ME.perms.includes(k),dd=x=>Math.round((new Date().setHours(0,0,0,0)-new Date(x.due+'T00:00:00'))/864e5);
function tbl(h,r,f,raw){const w=raw?'':'<div class=box>',z=raw?'':'</div>';return`${w}<table><thead><tr>${h.map((x,i)=>`<th class="${x[0]=='#'?'n':''}">${x.replace('#','')}`).join('')}</thead><tbody>${r.join('')||'<tr><td>Nothing here'}</tbody>${f?'<tfoot><tr>'+f+'</tfoot>':''}</table>${z}`}
function render(){
  const c=$('c').value,f=a=>c?a.filter(x=>x.company===c):a,S=f(D.sales),P=f(D.pre),U=f(D.purch),L=f(D.profit);CR=f(D.credit);
  const pr=sum(L,'income')-sum(L,'expense');
  $('kpis').innerHTML=[['sales','Sales ('+S.length+')',fmt(sum(S))],['pre','Prebookings ('+P.length+')',fmt(sum(P))],['purch','Purchases ('+U.length+')',fmt(sum(U))],['profit','Profit today',`<span class="${pr<0?'neg':'pos'}">${fmt(pr)}</span>`],['credit','Credit due ('+CR.length+')',fmt(sum(CR))]].filter(k=>has(k[0])).map(([,a,b])=>`<div class=k><small>${a}</small><b>${b}</b></div>`).join('');
  $('tabs').innerHTML=['today',...ME.perms].map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${TABS[k]}</button>`).join('');
  const row=x=>`<tr><td>${esc(x.name)}<td>${esc(x.partner)}<td>${esc(x.company)}<td class=n>${fmt(x.amount)}`,H=['Ref','Party','Company','#Amount'];
  let h='';
  if(tab==='today')h=todayView(S,P,U,L);
  if(tab==='sales')h=tbl(H,S.map(row),`<td colspan=3>Total<td class=n>${fmt(sum(S))}`);
  if(tab==='pre')h=tbl(H,P.map(row),`<td colspan=3>Total<td class=n>${fmt(sum(P))}`);
  if(tab==='purch')h=tbl(H,U.map(row),`<td colspan=3>Total<td class=n>${fmt(sum(U))}`);
  if(tab==='profit')h=tbl(['Company','#Income','#Expenses & COGS','#Profit'],L.map(x=>`<tr><td>${esc(x.company)}<td class=n>${fmt(x.income)}<td class=n>${fmt(x.expense)}<td class="n ${x.income<x.expense?'neg':'pos'}">${fmt(x.income-x.expense)}`),`<td>Total<td class=n>${fmt(sum(L,'income'))}<td class=n>${fmt(sum(L,'expense'))}<td class=n>${fmt(pr)}`);
  if(tab==='credit')h=tbl(['Invoice','Customer','Company','Due','#Days late','#Balance',''],CR.map((x,i)=>`<tr><td>${esc(x.name)}<td>${esc(x.partner)}<td>${esc(x.company)}<td>${x.due||''}<td class="n ${dd(x)>0?'neg':''}">${x.due?Math.max(dd(x),0):''}<td class=n>${fmt(x.amount)}<td><button onclick="mk(${i})">+ Reminder</button>`),`<td colspan=5>Total<td class=n>${fmt(sum(CR))}<td>`);
  if(tab==='tasks')h=taskView();
  if(tab==='users')h=userView();
  $('main').innerHTML=h;banner()
}
const sec=(t,b,r='')=>`<div class=box><div class=sh><b>${t}</b><span>${r}</span></div>${b}</div>`,tier=l=>l>30?['Critical','cr']:l>7?['High','hi']:l>0?['Watch','wa']:['Not due','wa'];
let PT=[];
function parties(){const m={};CR.forEach(x=>{const p=m[x.partner]||(m[x.partner]={name:x.partner,total:0,over:0,n:0,late:0,cos:new Set()}),d=x.due?dd(x):0;p.total+=x.amount;p.n++;if(d>0){p.over+=x.amount;p.late=Math.max(p.late,d)}p.cos.add(x.company)});return Object.values(m).sort((a,b)=>b.over-a.over||b.total-a.total)}
const tom=()=>{const d=new Date(Date.now()+864e5);d.setHours(10,0,0,0);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
async function plan(names){let n=0;try{for(const nm of names){const p=PT.find(x=>x.name===nm);if(!p||TK.some(t=>t.status==='open'&&t.type==='Collection'&&t.ref===nm))continue;
 await api('tasks','POST',{title:'Collect '+fmt(p.over||p.total)+' from '+nm,type:'Collection',ref:nm,company:[...p.cos][0]||'',note:p.n+' invoice(s), '+fmt(p.total)+' outstanding, oldest '+p.late+' days late',due:tom(),assignee:($('pa')||{}).value||ME.username});n++}
 TK=await api('tasks');render();$('msg').style.color='var(--gn)';$('msg').textContent=n?'Planned '+n+' collection task(s) for tomorrow 10:00':'Already planned for tomorrow'}catch(e){$('msg').textContent=e.message}}
function todayView(S,P,U,L){
  const c=$('c').value,e=new Date().setHours(23,59,59,999),mine=TK.filter(t=>t.status==='open'&&t.assignee===ME.username),T=t=>+new Date(t.due),
   td=mine.filter(t=>T(t)<=e).sort((a,b)=>T(a)-T(b)),tm=mine.filter(t=>T(t)>e&&T(t)<=e+864e5),
   ft=t=>t.due.slice(8,10)+'/'+t.due.slice(5,7)+' '+t.due.slice(11);
  const pn=sec("Today's plan ("+td.length+')',(td.map(t=>`<div class=it><input type=checkbox onchange="tg('${t.id}',this.checked)"><span style="flex:1">${esc(t.title)}</span><small class="${T(t)<Date.now()?'neg':''}">${ft(t)}</small></div>`).join('')||'<div class=it>Nothing due today 🎉</div>')+
   (tm.length?`<div class=it><b>Planned for tomorrow (${tm.length})</b></div>`+tm.map(t=>`<div class=it><span style="flex:1">${esc(t.title)}</span><small>${t.due.slice(11)}</small></div>`).join(''):''));
  const pb=has('pre')?sec('Prebookings today ('+P.length+' · '+fmt(sum(P))+')',[...P].sort((a,b)=>b.amount-a.amount).slice(0,6).map(x=>`<div class=it><span style="flex:1">${esc(x.partner)} <small>${esc(x.name)}</small></span><b>${fmt(x.amount)}</b></div>`).join('')||'<div class=it>None today</div>'):'';
  PT=parties();const ov=PT.filter(p=>p.over>0);
  const co=has('credit')?sec('Collect first · '+ov.length+' overdue · '+fmt(sum(ov,'over')),tbl(['Priority','Customer','#Inv','#Days late','#Overdue','#Total',''],PT.slice(0,10).map((p,i)=>{const t=tier(p.late);return`<tr><td><span class="bd ${t[1]}">${t[0]}</span><td>${esc(p.name)}<td class=n>${p.n}<td class=n>${p.late||''}<td class="n ${p.over?'neg':''}">${fmt(p.over)}<td class=n>${fmt(p.total)}<td><button onclick="plan([PT[${i}].name])">Plan</button>`}),null,true),
   `<select id=pa ${ME.role==='staff'?'disabled':''}>${US.map(u=>`<option value="${esc(u.username)}" ${u.username===ME.username?'selected':''}>${esc(u.name)}</option>`).join('')}</select> <button onclick="plan(PT.slice(0,5).map(p=>p.name))">Plan top 5 for tomorrow</button>`):'';
  const cols=[['sales','Sales',S],['pre','Prebookings',P],['purch','Purchases',U]].filter(k=>has(k[0])),cs=c?[c]:D.companies,by=(a,n)=>sum(a.filter(x=>x.company===n)),mx=Math.max(1,...cs.map(n=>by(S,n)));
  const st=tbl(['Company',...cols.map(k=>'#'+k[1]),...(has('profit')?['#Profit']:[])],cs.map(n=>{const l=L.find(x=>x.company===n),pf=l?l.income-l.expense:0;return`<tr><td>${esc(n)}${has('sales')?`<div class=bar style="width:${Math.round(by(S,n)/mx*100)}%"></div>`:''}${cols.map(k=>`<td class=n>${fmt(by(k[2],n))}`).join('')}${has('profit')?`<td class="n ${pf<0?'neg':'pos'}">${fmt(pf)}`:''}`}),
   `<td>Total${cols.map(k=>`<td class=n>${fmt(sum(k[2]))}`).join('')}${has('profit')?`<td class=n>${fmt(sum(L,'income')-sum(L,'expense'))}`:''}`,true);
  return`<div class=g2><div>${pn}${pb}</div><div>${co}</div><div style="grid-column:1/-1">${sec('Daily statement by company',st)}</div></div>`
}
function mk(i){const x=CR[i];pre={title:'Collect '+fmt(x.amount)+' from '+x.partner,type:'Collection',ref:x.name,company:x.company,note:'Invoice '+x.name+', due '+(x.due||'-')};tab='tasks';render()}
function taskView(){
  const opt=US.map(u=>`<option value="${esc(u.username)}" ${u.username===ME.username?'selected':''}>${esc(u.name)}</option>`).join('');
  const ty=['Task','Reminder','Collection'].map(t=>`<option ${pre.type===t?'selected':''}>${t}</option>`).join('');
  const T=[...TK].sort((a,b)=>(a.status=='done')-(b.status=='done')||new Date(a.due)-new Date(b.due));
  return`<div class=box><div class=f><input id=tt placeholder="Task / reminder" value="${esc(pre.title)}"><select id=ty>${ty}</select>
  <select id=ta ${ME.role==='staff'?'disabled':''}>${opt}</select><input id=td type=datetime-local><input id=tn placeholder="Note" value="${esc(pre.note)}"><button onclick="addTask()">Add</button></div></div>`+
  tbl(['','Task','Type','Ref','Assigned','Due',''],T.map(t=>{const late=t.status==='open'&&new Date(t.due)<Date.now(),a=US.find(u=>u.username===t.assignee);
   return`<tr class="${t.status}"><td><input type=checkbox ${t.status=='done'?'checked':''} onchange="tg('${t.id}',this.checked)"><td>${esc(t.title)}<td>${esc(t.type)}<td>${esc(t.ref||t.company)}<td>${esc(a?a.name:t.assignee)}<td class="${late?'neg':''}">${esc(t.due.replace('T',' '))}<td><button class=g onclick="rm('${t.id}')">✕</button>`}))
}
async function addTask(){try{await api('tasks','POST',{title:$('tt').value,type:$('ty').value,assignee:$('ta').value,due:$('td').value,note:$('tn').value,ref:pre.ref,company:pre.company});pre={};TK=await api('tasks');render()}catch(e){alert(e.message)}}
async function tg(id,d){await api('tasks/'+id,'PATCH',{status:d?'done':'open'});TK=await api('tasks');render()}
async function rm(id){if(confirm('Delete this task?')){await api('tasks/'+id,'DELETE');TK=await api('tasks');render()}}
function banner(){const n=new Date(),m=TK.filter(t=>t.status==='open'&&t.assignee===ME.username),o=m.filter(t=>new Date(t.due)<n).length,td=m.filter(t=>{const d=new Date(t.due);return d>=n&&d.toDateString()===n.toDateString()}).length;$('rem').hidden=!(o||td);$('rem').textContent=`🔔 ${o} overdue · ${td} due today (your tasks)`}
function userView(){
  const co=D.companies.map(c=>`<option>${esc(c)}</option>`).join('');
  return`<div class=box><div class=f><input id=un placeholder="Username"><input id=nm placeholder="Full name"><input id=pw type=password placeholder="Password (8+)">
  <select id=rl><option>staff</option><option>manager</option><option>admin</option></select><select id=cs multiple size=3 title="Leave empty = all companies">${co}</select><button onclick="saveUser()">Save user</button></div></div>`+
  tbl(['User','Name','Role','Companies',''],US.map(u=>`<tr><td>${esc(u.username)}<td>${esc(u.name)}<td>${esc(u.role)}<td>${esc((u.companies||[]).join(', ')||'All')}<td><button class=g onclick="delUser('${esc(u.username)}')">✕</button>`))
}
async function saveUser(){try{await api('users','POST',{username:$('un').value,name:$('nm').value,password:$('pw').value,role:$('rl').value,companies:[...$('cs').selectedOptions].map(o=>o.value)});US=await api('users');render()}catch(e){alert(e.message)}}
async function delUser(n){if(confirm('Delete '+n+'?')){try{await api('users/'+n,'DELETE');US=await api('users');render()}catch(e){alert(e.message)}}}
$('go').onclick=load;$('c').onchange=render;$('d').onchange=load;
setInterval(async()=>{if(!ME)return;try{TK=await api('tasks');banner();TK.filter(t=>t.status==='open'&&t.assignee===ME.username&&new Date(t.due)<=new Date()&&!seen.has(t.id)).forEach(t=>{seen.add(t.id);window.Notification&&Notification.permission==='granted'&&new Notification('Reminder',{body:t.title})})}catch(e){}},60000);
/*BOOT*/if(sessionStorage.t)start();/*END*/
</script></body></html>
